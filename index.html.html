<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f4f7;font-family:Arial,sans-serif}
.calculator{width:330px;background:#171717;padding:18px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.display{height:90px;background:#050505;color:#fff;border-radius:15px;margin-bottom:15px;padding:12px 16px;display:flex;align-items:flex-end;justify-content:flex-end;font-size:38px;overflow:hidden}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:64px;border:0;border-radius:14px;background:#303030;color:white;font-size:21px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.2)}
.operator{background:#ff9500}
.top{background:#a5a5a5;color:#111}
.equals{background:#ff9500}
.zero{grid-column:span 2}
</style>
</head>
<body>
<div class="calculator">
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button class="top" onclick="clearCalc()">AC</button>
    <button class="top" onclick="backspace()">⌫</button>
    <button class="top" onclick="percent()">%</button>
    <button class="operator" onclick="setOperator('/')">÷</button>

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="operator" onclick="setOperator('*')">×</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="operator" onclick="setOperator('-')">−</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button class="operator" onclick="setOperator('+')">+</button>

    <button class="zero" onclick="number('0')">0</button>
    <button onclick="decimal()">.</button>
    <button class="equals" onclick="calculate()">=</button>
  </div>
</div>

<script>
let current="0", previous=null, operator=null, waiting=false;
const display=document.getElementById("display");
function show(){display.textContent=current}
function number(n){
  if(waiting){current=n;waiting=false}
  else current=current==="0"?n:current+n;
  show();
}
function decimal(){
  if(waiting){current="0.";waiting=false}
  else if(!current.includes("."))current+=".";
  show();
}
function setOperator(op){
  if(operator&&!waiting)calculate();
  previous=parseFloat(current);
  operator=op;
  waiting=true;
}
function calculate(){
  if(operator===null||previous===null)return;
  const a=previous,b=parseFloat(current);
  let result;
  if(operator==="+")result=a+b;
  else if(operator==="-")result=a-b;
  else if(operator==="*")result=a*b;
  else result=b===0?"Error":a/b;
  current=typeof result==="string"?result:String(Number(result.toFixed(10)));
  previous=null;operator=null;waiting=true;show();
}
function clearCalc(){current="0";previous=null;operator=null;waiting=false;show()}
function backspace(){if(!waiting){current=current.length>1?current.slice(0,-1):"0";show()}}
function percent(){if(current!=="Error")current=String(parseFloat(current)/100);show()}
document.addEventListener("keydown",e=>{
  if(/[0-9]/.test(e.key))number(e.key);
  else if(e.key===".")decimal();
  else if(["+","-","*","/"].includes(e.key))setOperator(e.key);
  else if(e.key==="Enter"||e.key==="=")calculate();
  else if(e.key==="Escape")clearCalc();
  else if(e.key==="Backspace")backspace();
  else if(e.key==="%")percent();
});
</script>
</body>
</html>
